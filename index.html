<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KIRA × TURTLESIM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #090c10;
    --surface: #0f1318;
    --border: #1e2530;
    --accent: #4af0c4;
    --accent2: #7b8cff;
    --text: #c8d6e5;
    --muted: #4a5568;
    --danger: #ff5e7a;
    --warn: #f0c44a;
    --panel-bg: #0d1117;
  }

  body {
    font-family: 'Space Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    position: relative; z-index: 10;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
  }
  header .logo-wrap { display: flex; align-items: center; gap: 12px; }
  header .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; letter-spacing: 0.15em; color: var(--accent); }
  header .tag { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }
  
  .status-group { display: flex; align-items: center; gap: 12px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); transition: background 0.3s;
  }
  .status-dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .status-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }

  main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* LEFT: Simulator */
  .sim-panel {
    flex: 1.2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--border);
    background: #05070a;
    position: relative;
    padding: 20px;
  }

  #canvas-wrapper {
    position: relative;
    border: 2px solid var(--border);
    border-radius: 4px;
    background: #000;
    cursor: crosshair;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
  canvas { display: block; }

  .sim-hud {
    margin-top: 20px;
    display: flex;
    gap: 15px;
    align-items: center;
    width: 100%;
    max-width: 600px;
  }
  #command-display {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 16px;
    font-size: 0.8rem;
    text-align: center;
    border-radius: 2px;
  }
  #command-display span { color: var(--accent); font-weight: 700; }
  
  #sim-info {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* RIGHT: Kira */
  .kira-panel {
    width: 480px;
    display: flex;
    flex-direction: column;
    background: var(--panel-bg);
  }

  .face-section {
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    border-bottom: 1px solid var(--border);
  }
  #face-svg {
    width: 140px; height: 140px;
    filter: drop-shadow(0 0 10px rgba(74,240,196,0.1));
  }
  .emotion-label {
    font-family: 'Syne', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
  }

  .chat-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chat-messages {
    flex: 1; overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); }

  .msg { max-width: 85%; display: flex; flex-direction: column; gap: 4px; animation: fadeUp 0.3s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.ai { align-self: flex-start; align-items: flex-start; }
  .msg-role { font-size: 0.55rem; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; }
  .msg.ai .msg-role { color: var(--accent); }
  .msg-bubble { padding: 10px 14px; border-radius: 2px; font-size: 0.75rem; line-height: 1.6; border: 1px solid var(--border); }
  .msg.user .msg-bubble { background: #131922; border-color: var(--accent2); }
  .msg.ai .msg-bubble { background: var(--surface); }

  .chat-footer {
    padding: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  
  #mic-btn {
    width: 50px; height: 50px; border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    outline: none;
  }
  #mic-btn:hover { border-color: var(--accent); }
  #mic-btn.listening { border-color: var(--danger); animation: pulse-ring 1.2s infinite; }
  @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(255,94,122,0.4); } 100% { box-shadow: 0 0 0 15px rgba(255,94,122,0); } }
  #mic-btn svg { width: 20px; height: 20px; color: var(--text); }
  #mic-btn .stop-icon { display: none; }
  #mic-btn.listening .mic-icon { display: none; }
  #mic-btn.listening .stop-icon { display: block; fill: var(--danger); }

  .mic-hint { font-size: 0.6rem; color: var(--muted); letter-spacing: 0.05em; }
  
  /* Face parts */
  .face-ring { transition: all 0.6s ease; }
  .face-eye-l, .face-eye-r { transition: all 0.5s ease; }
  .face-mouth { transition: all 0.7s cubic-bezier(.34,1.56,.64,1); }
  .face-brow-l, .face-brow-r { transition: all 0.5s ease; }
  .face-blush-l, .face-blush-r { transition: opacity 0.5s ease; opacity: 0; }

  .thinking-dots span { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin: 0 2px; animation: blink 1.2s infinite both; }
  .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 0.7rem; }

</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="logo">KIRA × TURTLE</div>
    <div class="tag">Integrated Simulation</div>
  </div>
  <div class="status-group">
    <button id="key-reset" title="Reset API Key" style="background:var(--surface); border:1px solid var(--border); color:var(--muted); font-size:0.5rem; padding:4px 8px; cursor:pointer; border-radius:2px; font-family:inherit; transition: color 0.2s;">RESET API KEY</button>
    <div class="status-label" id="status-label">IDLE</div>
    <div class="status-dot" id="status-dot"></div>
  </div>
</header>

<main>
  <!-- LEFT: Simulator -->
  <div class="sim-panel">
    <div id="canvas-wrapper">
      <canvas id="sim" width="560" height="560"></canvas>
    </div>
    <div class="sim-hud">
      <div id="command-display">COMMAND: <span id="cmd-text">STOP</span></div>
      <div id="sim-info">X: 280 | Y: 280 | θ: -90°</div>
    </div>
    <div style="font-size: 0.65rem; color: var(--muted); margin-top: 10px;">
       Click grid to set target · Voice: forward, back, left, right, stop
    </div>
  </div>

  <!-- RIGHT: Kira -->
  <div class="kira-panel">
    <div class="face-section">
      <svg id="face-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="faceGrad" cx="50%" cy="45%" r="50%">
            <stop offset="0%" stop-color="#1a2030"/>
            <stop offset="100%" stop-color="#0d1018"/>
          </radialGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <circle class="face-ring" cx="100" cy="100" r="90" fill="none" stroke="#4af0c4" stroke-width="1.5" opacity="0.3"/>
        <circle cx="100" cy="100" r="82" fill="url(#faceGrad)" stroke="#1e2530" stroke-width="1"/>
        <ellipse class="face-blush-l" cx="62" cy="120" rx="16" ry="8" fill="#ff5e7a" opacity="0"/>
        <ellipse class="face-blush-r" cx="138" cy="120" rx="16" ry="8" fill="#ff5e7a" opacity="0"/>
        <path class="face-brow-l" id="brow-l" d="M62,72 Q74,66 84,70" stroke="#4af0c4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path class="face-brow-r" id="brow-r" d="M116,70 Q126,66 138,72" stroke="#4af0c4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse class="face-eye-l" id="eye-l" cx="76" cy="90" rx="10" ry="10" fill="#090c10" stroke="#4af0c4" stroke-width="1.5"/>
        <ellipse class="face-eye-r" id="eye-r" cx="124" cy="90" rx="10" ry="10" fill="#090c10" stroke="#4af0c4" stroke-width="1.5"/>
        <circle class="face-pupil-l" id="pupil-l" cx="76" cy="90" r="4.5" fill="#4af0c4" filter="url(#glow)"/>
        <circle class="face-pupil-r" id="pupil-r" cx="124" cy="90" r="4.5" fill="#4af0c4" filter="url(#glow)"/>
        <path class="face-mouth" id="mouth" d="M80,122 Q100,132 120,122" stroke="#4af0c4" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
      <div class="emotion-label" id="emotion-label">NEUTRAL</div>
    </div>

    <div class="chat-section">
      <div class="chat-messages" id="chat-messages">
        <div class="empty-state" id="empty-state">
          <div>Waiting for interaction...</div>
        </div>
      </div>
      
      <div class="chat-footer">
        <button id="mic-btn">
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>
          </svg>
          <svg class="stop-icon" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <div class="mic-hint" id="mic-hint">CLICK TO SPEAK</div>
      </div>
    </div>
  </div>
</main>

<script>
// ─── CONFIG & STATE ──────────────────────────────────────────
let GROQ_API_KEY = localStorage.getItem('kira_groq_api_key') || '';
if (!GROQ_API_KEY) {
  GROQ_API_KEY = prompt('Enter your Groq API key (gsk_...) to use KIRA:') || '';
  if (GROQ_API_KEY) localStorage.setItem('kira_groq_api_key', GROQ_API_KEY);
}

const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const trailCanvas = document.createElement('canvas');
trailCanvas.width = W; trailCanvas.height = H;
const trailCtx = trailCanvas.getContext('2d');
trailCtx.fillStyle = '#05070a';
trailCtx.fillRect(0, 0, W, H);

const TURTLE = {
  x: W/2, y: H/2,
  angle: -Math.PI / 2,
  speed: 0, rotSpeed: 0,
  target: null, // {x, y}
  size: 14,
  penDown: true
};

const MOVE_SPEED = 2.2;
const ROT_SPEED = 0.04;

// ─── KIRA FACE ───────────────────────────────────────────────
const Face = {
  el: {
    eyeL: document.getElementById('eye-l'), eyeR: document.getElementById('eye-r'),
    mouth: document.getElementById('mouth'), browL: document.getElementById('brow-l'),
    browR: document.getElementById('brow-r'), blushL: document.querySelector('.face-blush-l'),
    blushR: document.querySelector('.face-blush-r'), ring: document.querySelector('.face-ring'),
    label: document.getElementById('emotion-label')
  },
  set(emotion) {
    const e = this.el; e.label.textContent = emotion.toUpperCase();
    e.blushL.style.opacity = '0'; e.blushR.style.opacity = '0';
    e.ring.style.stroke = '#4af0c4'; e.ring.style.opacity = '0.3';

    switch(emotion) {
      case 'happy':
        e.eyeL.setAttribute('ry', '8'); e.eyeR.setAttribute('ry', '8');
        e.mouth.setAttribute('d', 'M76,118 Q100,138 124,118');
        e.blushL.style.opacity = '0.35'; e.blushR.style.opacity = '0.35'; break;
      case 'thinking':
        e.eyeL.setAttribute('ry', '9'); e.eyeR.setAttribute('ry', '5');
        e.mouth.setAttribute('d', 'M82,124 Q96,122 116,126'); break;
      case 'listening':
        e.ring.style.stroke = '#ff5e7a'; e.ring.style.opacity = '0.6';
        e.mouth.setAttribute('d', 'M82,124 Q100,128 118,124'); break;
      case 'excited':
        e.eyeL.setAttribute('ry', '11'); e.eyeR.setAttribute('ry', '11');
        e.mouth.setAttribute('d', 'M72,116 Q100,142 128,116');
        e.blushL.style.opacity = '0.5'; e.blushR.style.opacity = '0.5'; break;
      case 'neutral':
      default:
        e.eyeL.setAttribute('ry', '10'); e.eyeR.setAttribute('ry', '10');
        e.mouth.setAttribute('d', 'M80,122 Q100,132 120,122'); break;
    }
  }
};

// ─── CHAT & API ──────────────────────────────────────────────
const chatEl = document.getElementById('chat-messages');
const emptyState = document.getElementById('empty-state');
let history = [];

function addMessage(role, content) {
  if (emptyState) emptyState.style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  wrap.innerHTML = `<div class="msg-role">${role === 'user' ? 'YOU' : 'KIRA'}</div><div class="msg-bubble">${content}</div>`;
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ─── SPEECH SYNTHESIS ─────────────────────────────────────────
function speak(text) {
  if (!window.speechSynthesis) return;
  // Cancel any ongoing speech
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.pitch = 1.1; // Slightly higher pitch for Kira
  utterance.rate = 1.0;
  window.speechSynthesis.speak(utterance);
}

async function askKira(text) {
  addMessage('user', text);
  Face.set('thinking');
  const thinking = document.createElement('div');
  thinking.className = 'msg ai';
  thinking.innerHTML = `<div class="msg-role">KIRA</div><div class="msg-bubble thinking-dots"><span></span><span></span><span></span></div>`;
  chatEl.appendChild(thinking);
  chatEl.scrollTop = chatEl.scrollHeight;

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${GROQ_API_KEY}` },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [
          { role: 'system', content: 'You are KIRA, an expressive AI companion. Keep responses concise (2-3 sentences). End with <emotion>EMOTION</emotion> (happy, thinking, excited, neutral).' },
          ...history, { role: 'user', content: text }
        ]
      })
    });

    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error?.message || `API error ${res.status}`);
    }

    const data = await res.json();
    thinking.remove();
    const reply = data.choices[0].message.content;
    const emotion = reply.match(/<emotion>(\w+)<\/emotion>/)?.[1] || 'neutral';
    const clean = reply.replace(/<emotion>.*<\/emotion>/s, '').trim();
    addMessage('ai', clean);
    Face.set(emotion);
    history.push({ role: 'user', content: text }, { role: 'assistant', content: reply });
  } catch (e) {
    thinking.remove();
    addMessage('ai', `<span style="color:var(--danger)">Error: ${e.message}</span>`);
    if (e.message.toLowerCase().includes('api key')) {
        addMessage('ai', '<span style="color:var(--warn)">Your API key seems incorrect. Click "RESET API KEY" in the top right to update it.</span>');
    }
    console.error('Kira Connectivity Error:', e);
  }
}

document.getElementById('key-reset').onclick = () => {
  const newKey = prompt('Enter your Groq API key (gsk_...):');
  if (newKey) {
    GROQ_API_KEY = newKey;
    localStorage.setItem('kira_groq_api_key', newKey);
    addMessage('ai', 'Neural link updated with new access key.');
    history = []; // optional: clear history on key change
  }
};

// ─── TURTLE LOGIC ─────────────────────────────────────────────
function drawGrid() {
  ctx.strokeStyle = 'rgba(30, 37, 48, 0.4)';
  ctx.lineWidth = 0.5;
  for(let x=0; x<=W; x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0; y<=H; y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}

function drawStickFigure(x, y) {
  ctx.save();
  ctx.strokeStyle = '#ff5e7a'; // Solid color
  ctx.lineWidth = 3;           // Thicker lines
  ctx.lineCap = 'round';
  
  // Neon glow effect for maximum visibility
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#ff5e7a';
  
  // Head
  ctx.beginPath(); ctx.arc(x, y - 24, 6, 0, Math.PI*2); ctx.stroke();
  // Body
  ctx.beginPath(); ctx.moveTo(x, y - 18); ctx.lineTo(x, y + 2); ctx.stroke();
  // Arms
  ctx.beginPath(); ctx.moveTo(x - 12, y - 10); ctx.lineTo(x + 12, y - 10); ctx.stroke();
  // Legs
  ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x - 10, y + 15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x + 10, y + 15); ctx.stroke();
  ctx.restore();
}

function drawTurtle(x, y, angle) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + Math.PI/2);
  // Body
  ctx.beginPath(); ctx.ellipse(0, 0, TURTLE.size*0.7, TURTLE.size, 0, 0, Math.PI*2);
  ctx.fillStyle = '#2ecc71'; ctx.fill(); ctx.stroke();
  // Head
  ctx.beginPath(); ctx.arc(0, -TURTLE.size-2, 5, 0, Math.PI*2);
  ctx.fillStyle = '#27ae60'; ctx.fill(); ctx.stroke();
  ctx.restore();
}

function update() {
  const prevX = TURTLE.x, prevY = TURTLE.y;

  if (TURTLE.target) {
    const dx = TURTLE.target.x - TURTLE.x;
    const dy = TURTLE.target.y - TURTLE.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist > 4) {
      const targetAngle = Math.atan2(dy, dx);
      let diff = targetAngle - TURTLE.angle;
      while (diff > Math.PI) diff -= Math.PI*2;
      while (diff < -Math.PI) diff += Math.PI*2;

      if (Math.abs(diff) > 0.1) {
        TURTLE.rotSpeed = Math.sign(diff) * ROT_SPEED;
        TURTLE.speed = 0;
      } else {
        TURTLE.rotSpeed = 0;
        TURTLE.speed = MOVE_SPEED;
      }
    } else {
      // Arrived
      TURTLE.target = null;
      TURTLE.speed = 0; TURTLE.rotSpeed = 0;
      onArrival();
    }
  }

  TURTLE.angle += TURTLE.rotSpeed;
  const nx = TURTLE.x + Math.cos(TURTLE.angle) * TURTLE.speed;
  const ny = TURTLE.y + Math.sin(TURTLE.angle) * TURTLE.speed;
  
  const M = TURTLE.size + 5;
  TURTLE.x = Math.max(M, Math.min(W-M, nx));
  TURTLE.y = Math.max(M, Math.min(H-M, ny));

  if (TURTLE.penDown && (TURTLE.x !== prevX || TURTLE.y !== prevY)) {
    trailCtx.beginPath(); trailCtx.moveTo(prevX, prevY); trailCtx.lineTo(TURTLE.x, TURTLE.y);
    trailCtx.strokeStyle = 'rgba(74, 240, 196, 0.4)'; trailCtx.lineWidth = 2; trailCtx.stroke();
  }

  document.getElementById('sim-info').textContent = `X: ${Math.round(TURTLE.x)} | Y: ${Math.round(TURTLE.y)} | θ: ${Math.round(TURTLE.angle*180/Math.PI)}°`;
}

function onArrival() {
  askKira("I have reached the coordinates you marked. What should we do now?");
}

function render() {
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(trailCanvas, 0, 0);
  drawGrid();
  if (TURTLE.target) drawStickFigure(TURTLE.target.x, TURTLE.target.y);
  drawTurtle(TURTLE.x, TURTLE.y, TURTLE.angle);
  requestAnimationFrame(render);
}

// ─── INTERACTION ──────────────────────────────────────────────
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  TURTLE.target = { x: e.clientX - rect.left, y: e.clientY - rect.top };
  document.getElementById('cmd-text').textContent = 'AUTO-NAV';
});

// ─── VOICE ────────────────────────────────────────────────────
const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
if (Speech) {
  const rec = new Speech();
  rec.continuous = true; rec.interimResults = true;
  
  rec.onstart = () => {
    document.getElementById('mic-btn').classList.add('listening');
    document.getElementById('mic-hint').textContent = 'LISTENING...';
    Face.set('listening');
  };

  let lastResultIndex = 0;
  rec.onresult = (e) => {
    for (let i = lastResultIndex; i < e.results.length; i++) {
        const result = e.results[i];
        const transcript = result[0].transcript.toLowerCase();
        
        // Prioritize STOP to prevent unintended movement resumption
        if (transcript.includes('stop')) { 
          TURTLE.speed = 0; TURTLE.rotSpeed = 0; TURTLE.target = null; speak('Stopping.'); 
        }
        else if (transcript.includes('forward')) { TURTLE.speed = MOVE_SPEED; TURTLE.rotSpeed = 0; TURTLE.target = null; speak('Going straight.'); }
        else if (transcript.includes('back')) { TURTLE.speed = -MOVE_SPEED; TURTLE.rotSpeed = 0; TURTLE.target = null; speak('Going backward.'); }
        else if (transcript.includes('left')) { TURTLE.rotSpeed = -ROT_SPEED; TURTLE.speed = 0; TURTLE.target = null; speak('Turning left.'); }
        else if (transcript.includes('right')) { TURTLE.rotSpeed = ROT_SPEED; TURTLE.speed = 0; TURTLE.target = null; speak('Turning right.'); }
        
        if (result.isFinal) {
            lastResultIndex = i + 1;
            if (!['forward','back','left','right','stop'].some(c => transcript.includes(c))) {
                askKira(transcript);
            }
        }
        
        const cmd = TURTLE.target ? 'AUTO-NAV' : (TURTLE.speed > 0 ? 'FORWARD' : (TURTLE.speed < 0 ? 'BACKWARD' : (TURTLE.rotSpeed !== 0 ? 'TURNING' : 'STOP')));
        document.getElementById('cmd-text').textContent = cmd;
    }
  };

  rec.onend = () => {
    lastResultIndex = 0;
    document.getElementById('mic-btn').classList.remove('listening');
    document.getElementById('mic-hint').textContent = 'CLICK TO SPEAK';
    Face.set('neutral');
  };

  document.getElementById('mic-btn').onclick = () => {
    try { rec.start(); } catch(e) { rec.stop(); }
  };
}

// ─── INIT ─────────────────────────────────────────────────────
setInterval(update, 1000/60);
render();
Face.set('neutral');

</script>
</body>
</html>
